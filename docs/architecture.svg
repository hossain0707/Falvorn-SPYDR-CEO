 <rect class="box" x="26" y="56" width="172" height="110" rx="15"/><text class="title" x="112" y="94" text-anchor="middle">Human Owner</text><text class="sub" x="112" y="121" text-anchor="middle">Goals &amp; decisions</text>
 <rect class="box" x="257" y="56" width="196" height="110" rx="15"/><text class="title" x="355" y="94" text-anchor="middle">CEO Planner</text><text class="sub" x="355" y="120" text-anchor="middle">Approval gate</text>
 <rect class="box" x="507" y="56" width="193" height="110" rx="15"/><text class="title" x="603" y="94" text-anchor="middle">Specialist Agents</text><text class="sub" x="603" y="120" text-anchor="middle">Scoped text delivery</text>
 <rect class="box" x="750" y="56" width="137" height="110" rx="15"/><text class="title" x="819" y="94" text-anchor="middle">AI Model</text><text class="sub" x="819" y="120" text-anchor="middle">Provider API</text>
 <rect x="926" y="56" width="88" height="110" rx="15" fill="#173b3c" stroke="#457f7b" stroke-width="2"/><text x="970" y="98" text-anchor="middle" style="font-size:14px;font-weight:bold">SQLite</text><text class="sub" x="970" y="120" text-anchor="middle">Audit</text>
 <text x="520" y="197" fill="#85b9bf" text-anchor="middle" class="sub">Plan approval and per-task initiation are mandatory · No silent publishing or code execution</text>
