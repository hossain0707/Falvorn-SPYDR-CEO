<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 220" role="img" aria-label="Agent company architecture showing owner, approval-gated orchestration, specialists, model, and audit store">
 <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1929"/><stop offset="1" stop-color="#15233c"/></linearGradient><linearGradient id="a"><stop stop-color="#75dfd7"/><stop offset="1" stop-color="#9da0ff"/></linearGradient><style>text{font-family:ui-sans-serif,system-ui,sans-serif;fill:#e9f1fb}.sub{fill:#90a9bf;font-size:13px}.title{font-size:17px;font-weight:bold}.path{stroke:#64c9c4;stroke-dasharray:6 6;animation:move 3s linear infinite}.box{fill:#15283d;stroke:#35516a;stroke-width:2}@keyframes move{to{stroke-dashoffset:-48}}</style></defs>
 <rect width="1040" height="220" rx="18" fill="url(#bg)"/>
